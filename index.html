<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Conversor de Moedas</title>
  </head>
  <body>
    <main class="container">
      <h1>Conversor de Moedas</h1>
      <p>Converta sua moeda</p>

      <form class="formulario" id="formulario">
        <p>
          <label for="valor-em-reais">Digite o valor em R$:</label>
          <input
            type="number"
            id="valor-em-reais"
            min="0.01"
            step="0.01"
            placeholder="0.00"
            required
          />
        </p>
        <p>
          <label for="selecao-de-moedas">Selecione a moeda:</label>
          <select name="selecao-de-moedas" id="selecao-de-moedas" required>
            <option value="" selected disabled>Selecione</option>
            <option value="USD">Dólar americano - USD</option>
            <option value="EUR">Euro - EUR</option>
            <option value="GBP">Libra esterlina - GBP</option>
          </select>
        </p>
        <button class="botao-conversor" type="submit">Converter</button>
      </form>

      <section class="area-resultado" id="resultado"></section>
      <section class="area-mensagem-erro" id="msg-erro"></section>
    </main>
    <script src="index.js"></script>
  </body>
</html>
